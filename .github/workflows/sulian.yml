name: Update SpeedLink Nodes

on:
  workflow_dispatch:
    inputs:
      output_file:
        description: '输出文件路径'
        required: false
        default: 'nodes.txt'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch remote JS and nodes
        env:
          sunlian: ${{ secrets.sunlian || vars.sunlian }}
          OUTPUT_FILE: ${{ github.event.inputs.output_file || vars.OUTPUT_FILE || 'nodes.txt' }}
        run: node scripts/run-remote-speedlink.js

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: Update SpeedLink nodes
          file_pattern: ${{ github.event.inputs.output_file || vars.OUTPUT_FILE || 'nodes.txt' }}